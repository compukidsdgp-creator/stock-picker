name: swingscope-daily

# Cron is UTC. 12:30 UTC = 18:00 IST (after the 15:30 close, giving Yahoo
# time to settle EOD candles). Adjust to taste. Weekdays only.
on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # needed to commit results back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "picks: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
